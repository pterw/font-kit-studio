<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bridge test target (in-target overlay)</title>
<!--
  Opts out of auto-init (data-auto-init="false"), then constructs the bridge
  with enableHighlightOverlay: true (the legacy in-target overlay).
  Used by tests/test_bridge_runtime.py.
-->
</head>
<body>
<main>
  <h1 data-design-id="overlay.title">Overlay target</h1>
  <p data-design-id="overlay.body">Body copy</p>
</main>
<script src="/fontkit-bridge.js" data-auto-init="false"></script>
<script>new FontKitBridge({ enableHighlightOverlay: true });</script>
</body>
</html>
