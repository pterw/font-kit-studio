<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bootstrap 4 fixture</title>
  <link rel="stylesheet" href="vendor/bootstrap.min.css">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <main class="container py-5">
    <section class="type-corpus" aria-label="Typography corpus">
      <h1 class="h1" data-design-id="bs4.heading.1">Heading 1</h1>
      <h2 class="h2" data-design-id="bs4.heading.2">Heading 2</h2>
      <h3 class="h3" data-design-id="bs4.heading.3">Heading 3</h3>
      <h4 class="h4" data-design-id="bs4.heading.4">Heading 4</h4>
      <h5 class="h5" data-design-id="bs4.heading.5">Heading 5</h5>
      <h6 class="h6" data-design-id="bs4.heading.6">Heading 6</h6>
      <p class="display-1" data-design-id="bs4.display.1">Display 1</p>
      <p class="display-2" data-design-id="bs4.display.2">Display 2</p>
      <p class="display-3" data-design-id="bs4.display.3">Display 3</p>
      <p class="display-4" data-design-id="bs4.display.4">Display 4</p>
      <p class="lead" data-design-id="bs4.lead">Lead paragraph</p>
      <small class="small" data-design-id="bs4.small">Small annotation</small>
      <button type="button" class="btn btn-secondary" data-design-id="bs4.button">Button action</button>
      <nav><a href="#" class="nav-link" data-design-id="bs4.navigation">Navigation link</a></nav>
      <nav class="navbar"><a href="#" class="navbar-brand" data-design-id="bs4.brand">Local brand</a></nav>
      <article class="card"><h5 class="card-title" data-design-id="bs4.card">Card title</h5></article>
      <label class="form-label" for="sample-input" data-design-id="bs4.label">Form label</label>
      <input id="sample-input" aria-label="Sample input">
      <p class="role-copy" data-design-role=" Editorial " data-design-id="bs4.role.base">Author role base</p>
      <p class="role-copy role-variant" data-design-role="Editorial" data-design-id="bs4.role.variant">Author role variant</p>
      <p class="role-copy" data-design-role="editorial" data-design-id="bs4.role.case">Case sensitive role</p>
    </section>
  </main>
</body>
</html>
