name: Quality Gate

on:
  push:
    branches:
      - main
  pull_request:
  # Manual escape hatch for re-running the gate on any ref. Note this trigger
  # only becomes usable once the workflow file is on the default branch.
  workflow_dispatch:
  # The release workflow (release.yml) runs these same gates on a version tag.
  workflow_call:

# The gate only reads the repository. No token scope beyond that, no secrets.
permissions:
  contents: read

# A newer push to the same branch or pull request makes the older run
# pointless, so it is cancelled instead of queueing behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    # A hung browser would otherwise hold a runner for six hours.
    timeout-minutes: 30

    steps:
      # Full history and tags on purpose: scripts/verify.py checks the original
      # v0.1.1 file against the `supplied-v0.1.1` tag, and a shallow clone has
      # no tag to compare, so provenance would be skipped instead of verified.
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-dev.txt

      # Only for `node --check fontkit-bridge.js`. Studio and the bridge have
      # no runtime dependencies and no build step, so nothing else uses Node.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      # Cheapest checks first: these two finish in a second or two and need no
      # browser, so a duplicate id, a syntax error or a drifted provenance
      # hash is reported before any browser is installed.
      - name: Static checks (ids, inline JS, provenance)
        run: python scripts/verify.py --static-only

      - name: Syntax-check the bridge
        run: node --check fontkit-bridge.js

      # Pyflakes rules only (ruff.toml): unused or undefined names and syntax
      # errors. Lint, not formatting, so it never restyles a file.
      - name: Lint Python (ruff)
        run: python -m ruff check .

      # History carries product changes only: no session links, AI co-author
      # trailers or "Generated with" banners (see CONTRIBUTING.md). Stdlib only,
      # so it costs nothing and reports before any browser is installed. The
      # full-history checkout above is what makes the base ref available.
      # Values go through env, never interpolated into the script text.
      - name: Check commit messages
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          case "$EVENT" in
            pull_request) python scripts/dev/check_commit_messages.py --range "origin/${BASE_REF}..HEAD" ;;
            push)
              # A new branch reports an all-zero "before", and a force-push can
              # leave a "before" that no longer exists: check the last commit then.
              if git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
                python scripts/dev/check_commit_messages.py --range "${BEFORE}..${SHA}"
              else
                python scripts/dev/check_commit_messages.py
              fi ;;
            # Manual run: everything this ref adds over main when main is
            # available, otherwise (or on main itself) the last commit.
            *)            python scripts/dev/check_commit_messages.py --base origin/main ;;
          esac

      # The hooks in .pre-commit-config.yaml over the whole tree, so a hook that
      # breaks on the repository fails here, not on a contributor's next commit.
      - name: Pre-commit hooks
        run: python -m pre_commit run --all-files

      # The whitespace hook sees only staged lines, so it passes vacuously above.
      # This checks the lines this change adds. Values go through env, never
      # interpolated into the script text.
      - name: No trailing whitespace in this change
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          case "$EVENT" in
            pull_request) git diff --check "origin/${BASE_REF}...HEAD" ;;
            push)
              if git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
                git diff --check "${BEFORE}" "${SHA}"
              fi ;;
          esac

      # Browsers are the expensive part, so they come after every cheaper
      # gate. --with-deps installs the system libraries Chromium and Firefox
      # need on a bare runner. Both are installed: Chromium blocks, Firefox runs
      # an advisory canary (see README "Firefox status", D037).
      - name: Install Playwright browsers
        run: python -m playwright install --with-deps chromium firefox

      # Font Kit Studio is desktop-first (README "Frontend gate"): only
      # Chromium at the desktop profile can fail the gate. The same command
      # also runs Firefox and the phone and wide-touch profiles; under the
      # default `--enforce chromium:desktop` their findings print as ADVISORY
      # lines and can never change the exit code, so this step needs no
      # continue-on-error. It takes seconds per engine and covers layout,
      # contrast, privacy and the live edit flow, so it runs before the
      # multi-minute suite. It needs no secrets and starts its own server on
      # loopback ports.
      - name: Run frontend gate (Chromium desktop blocks; the rest is advisory)
        run: python scripts/dev/frontend_gate.py --engines chromium,firefox

      # Blocking: the full suite on Chromium. Runs even when the gate failed,
      # so one run reports both. The slowest step comes last (several minutes).
      - name: Run tests (Chromium, blocking)
        if: ${{ !cancelled() }}
        env:
          FKS_ENGINES: chromium
          FKS_REQUIRE_PRECOMMIT: '1'
        run: python -m unittest discover -s tests -v

      # The cookie canary runs the real Vite command. Install its fixture and
      # bundle the package so missing dependencies cannot silently skip it.
      - name: Prepare the localhost cookie fixture
        if: ${{ !cancelled() }}
        run: |
          npm ci --prefix fixtures/vite-react
          npm --prefix packages/fontkitstudio run prepack

      # Advisory: a short Firefox canary, not the full suite (D037). The whole
      # suite on Gecko took about twice as long as on Chromium and pushed the
      # job toward its timeout, which would fail the blocking check. The list
      # lives in tests/firefox_canary.py: the bridge's trust boundary, real
      # Studio against the real bridge, and Studio's own rendering.
      # continue-on-error keeps a Firefox-only failure from failing the job,
      # and the step's own failure mark and log stay visible so it can be read.
      - name: Run Firefox canary (advisory - never fails the build)
        if: ${{ !cancelled() }}
        continue-on-error: true
        # A hung Gecko run stops here, as an advisory failure, instead of
        # running into the job timeout, which would fail the blocking check.
        timeout-minutes: 10
        env:
          FKS_ENGINES: firefox
          FKS_REQUIRE_FIXTURES: '1'
          PYTHONPATH: tests
        run: python -m unittest firefox_canary -v

      # The gate saves a screenshot of every failing or advisory run here
      # (work/ is git-ignored scratch). Nothing is uploaded when there are none.
      - name: Upload gate screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: frontend-gate-screenshots
          path: work/frontend-gate/
          if-no-files-found: ignore
          retention-days: 14

  # The npm package (packages/fontkitstudio): zero dependencies, so no install
  # step. Node lines and systems are fixed by D043.
  node-package:
    name: Node package (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: '22' }
          - { os: ubuntu-latest, node: '24' }
          - { os: ubuntu-latest, node: '26' }
          - { os: macos-latest, node: '24' }
          - { os: windows-latest, node: '24' }
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Test the package
        working-directory: packages/fontkitstudio
        run: npm test

  # The one command on real Vite projects, on the Node lines and systems D043
  # fixes, with the friction test's time budget.
  fixtures:
    name: Fixtures, Vite 7 and 8 (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: '22' }
          - { os: ubuntu-latest, node: '24' }
          - { os: ubuntu-latest, node: '26' }
          - { os: macos-latest, node: '24' }
          - { os: windows-latest, node: '24' }
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: fixtures/*/package-lock.json
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the fixtures
        run: |
          npm ci --prefix fixtures/vite-react
          npm ci --prefix fixtures/vite7-react
          npm ci --prefix fixtures/vite-ts
      - name: Bundle Studio and the bridge
        run: npm --prefix packages/fontkitstudio run prepack
      - name: Install the test tools and Chromium
        run: |
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Fixture tests (never skipped here)
        env:
          FKS_ENGINES: chromium
          FKS_REQUIRE_FIXTURES: '1'
          PYTHONPATH: tests
        run: python -m unittest test_vite_build_guarantee test_one_command_vite test_one_command_proxy test_localhost_cookies test_friction test_vite_types -v

  # Proxy mode in front of a real Next.js dev server, including its hot reload
  # over the proxy's WebSocket pass-through. Its own job: Next's install is large.
  next-fixture:
    name: Fixture, Next.js behind the proxy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: fixtures/next-app/package-lock.json
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the fixture
        run: npm ci --prefix fixtures/next-app
      - name: Bundle Studio and the bridge
        run: npm --prefix packages/fontkitstudio run prepack
      - name: Install the test tools and Chromium
        run: |
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Next.js fixture test (never skipped here)
        env:
          FKS_ENGINES: chromium
          FKS_REQUIRE_FIXTURES: '1'
          NEXT_TELEMETRY_DISABLED: '1'
          PYTHONPATH: tests
        run: python -m unittest test_one_command_next -v
